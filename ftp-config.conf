ServerName              "86Box Windows 98 FTP"
ServerType              standalone
DefaultServer           on

Port                    2121
UseIPv6                 off
UseReverseDNS           off

DefaultAddress          127.0.0.1

PassivePorts            50000 50010
MasqueradeAddress       10.0.2.2

# Drop the daemon to your account after startup.
User                    jdrake
Group                   staff

<Anonymous /Users/jdrake/Projects/stars-breakdown/ftp-share>

    User                jdrake
    Group               staff

    UserAlias           anonymous jdrake
    UserAlias           ftp jdrake

    AnonRequirePassword off
    RequireValidShell   off

    # Sensible permissions for files uploaded from Win98.
    Umask               022 022

    <Limit READ DIRS>
        AllowAll
    </Limit>

    <Limit WRITE>
        AllowAll
    </Limit>

</Anonymous>
