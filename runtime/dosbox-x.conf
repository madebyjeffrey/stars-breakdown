[sdl]
fullscreen=false
output=surface
autolock=false
mouse emulation=integration
waitonerror=false

[dosbox]
title=Stars study - Windows for Workgroups 3.11
machine=svga_et4000
memsize=32
synchronize time=false
captures=captures

[cpu]
core=normal
cputype=pentium
cycles=fixed 20000
fpu=true
integration device=true

[render]
aspect=true
scaler=normal2x

[mixer]
nosound=true

[midi]
mididevice=none

[dos]
hard drive data rate limit=0
floppy drive data rate limit=0

[log]
int21=false
fileio=false

[autoexec]
@echo off
mount c guest
c:
set TEMP=C:\TEMP
set PATH=C:\WINDOWS;C:\STARS;Z:\
date 01-01-2000
time 12:00:00
