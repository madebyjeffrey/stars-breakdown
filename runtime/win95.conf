[sdl]
fullscreen=false
output=surface
autolock=true
# Standard guest mouse driver: Ctrl+F10 releases/re-captures the pointer.
mouse emulation=integration
waitonerror=false

[dosbox]
title=Stars study - Windows 98
machine=svga_s3trio64v+
memsize=256
synchronize time=false
captures=captures

[cpu]
core=normal
cputype=pentium_mmx
fpu=true
integration device=true

[sblaster]
sbtype=sb16vibra

[fdc, primary]
int13fakev86io=true

[ide, primary]
int13fakeio=true
int13fakev86io=true

[ide, secondary]
int13fakeio=true
int13fakev86io=true
cd-rom insertion delay=4000

[render]
aspect=true
scaler=none

[mixer]
nosound=false

[midi]
mididevice=none

[dos]
hard drive data rate limit=0
floppy drive data rate limit=0
ver=7.1

[log]
int21=false
fileio=false

[autoexec]
@echo off
imgmount c "/Users/jdrake/Projects/stars-breakdown/runs/step4/win95.img" -ide 1m
# A second hard disk becomes D: in a normal single-partition Windows setup.
# Finish the current MSVC installation before restarting with this addition.
imgmount d "/Users/jdrake/Projects/stars-breakdown/runs/step4/transfer.img" -ide 1s
imgmount e "/Users/jdrake/Downloads/Microsoft Visual C++ - Version 1.52c (Microsoft) (1995).iso" -t iso -ide 2m
# No host DOS commands after BOOT: Windows uses the image's own startup files.
boot c:
